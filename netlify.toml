# Cloudflare Pages configuration
[build]
  command = "npm run build:cf"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"
  # Disable problematic caching
  GATSBY_DISABLE_CACHING = "true"
  # Skip cache directory creation
  CI = "true"
  # Memory optimization
  NODE_OPTIONS = "--max_old_space_size=4096"
