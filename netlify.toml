# Cloudflare Pages configuration - NO CACHE
[build]
  command = "npm run build:cf"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"
  # Disable ALL caching
  GATSBY_CACHE = "false"
  GATSBY_DISABLE_CACHING = "true"
  CI_CACHE_DISABLED = "true"
  NO_CACHE = "true"
  SKIP_CACHE = "true"
  # Memory optimization
  NODE_OPTIONS = "--max_old_space_size=4096"
