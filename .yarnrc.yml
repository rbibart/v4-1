# Configuration for Cloudflare Pages build environment
nodeLinker: node-modules

# Faster installation with timeout adjustments
compressionLevel: mixed
preferAggregateCacheInfo: false

# Sharp package specific settings for Cloudflare
enableTimers: false
httpTimeout: 300000
httpRetry: 3

# Network optimization
enableNetwork: true
networkTimeout: 300000

# Ignore certificate issues in build environment
strict: false